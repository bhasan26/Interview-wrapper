<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
    <title>Interview Overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="overlay-root" aria-live="polite">
      <section id="response-panel" class="response-panel" aria-label="Interview response panel" hidden>
        <header id="drag-handle" class="drag-handle" title="Drag to reposition panel">
          <span class="grip" aria-hidden="true"></span>
          <span class="panel-title">Interview Overlay</span>
          <span id="status-indicator" class="status-indicator status-ready">Ready</span>
        </header>

        <section class="question-section" aria-labelledby="question-heading">
          <div class="section-heading">
            <h1 id="question-heading">Question</h1>
            <span class="hint">captured or typed</span>
          </div>
          <textarea id="question-text" class="question-text" spellcheck="false" placeholder="Type or capture a question…"></textarea>
        </section>

        <section class="answer-section" aria-labelledby="answer-heading">
          <div class="section-heading">
            <h2 id="answer-heading">Answer</h2>
            <span class="hint">markdown preview</span>
          </div>
          <div id="answer-content" class="answer-content markdown-body">
            <p>Trigger the panel to show AI responses here.</p>
          </div>
        </section>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
